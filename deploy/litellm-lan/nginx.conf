# Relais LiteLLM : routes de modèle seulement, sans mise en mémoire tampon (réponses en flux).
server_tokens off;
upstream litellm { server litellm:4000; keepalive 8; }
server {
  listen 8080;
  client_max_body_size 20m;
  location = /relais-sante { access_log off; default_type text/plain; return 200 "ok\n"; }
  location ~ ^/v1/(chat/completions|completions|embeddings|models|responses)$ {
    proxy_pass http://litellm;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_read_timeout 600s;
  }
  location / { return 404; }
}
