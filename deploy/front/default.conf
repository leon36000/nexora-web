# Proxy frontal local du site (nginx sans privilège, port 8080 dans le conteneur) — docs/guide-operateur.md §9.
#
# Il se place entre `tailscale serve` (ou un proxy HTTPS public plus tard) et le site. Ce qu'il impose :
#  - /api/admin/* et /api/revalidate ne sont JAMAIS joignables par ce chemin (ils ne servent qu'au réseau interne :
#    Directus, worker, outils) ;
#  - TRACE, TRACK et CONNECT refusés ;
#  - adresse du client : X-Forwarded-For n'est cru que s'il vient d'un proxy local de confiance (hôte, réseaux Docker) ;
#    sinon l'adresse de la connexion est utilisée, et l'en-tête reçu est ÉCRASÉ (pas de contournement de la limitation
#    de débit) ;
#  - limitation de débit par adresse sur /api/auth/*, /api/contact, /api/stripe/webhook et /v1/* (les limites du site
#    sont par processus ou par compte ; celle-ci est la première ligne contre les rafales anonymes). Les valeurs sont un
#    point de départ, à ajuster avec du trafic réel ;
#  - les en-têtes de sécurité (CSP, HSTS…) restent ceux du site : rien n'est retiré.

server_tokens off;

# Proxy local de confiance : `tailscale serve` joint le port publié depuis l'hôte, vu du conteneur comme une adresse du
# réseau Docker. Un client du réseau local ou d'Internet n'est jamais dans ces plages.
set_real_ip_from 127.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
real_ip_header X-Forwarded-For;
real_ip_recursive off;

limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=contact:10m rate=1r/s;
limit_req_zone $binary_remote_addr zone=webhook:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=gateway:10m rate=30r/s;
limit_req_status 429;

map $http_x_forwarded_proto $proto {
  default $scheme;
  https https;
}

upstream site {
  server site:3500;
  keepalive 16;
}

server {
  listen 8080 default_server;
  server_name _;
  client_max_body_size 25m;
  proxy_read_timeout 120s;
  # Pas de fichier temporaire (le système de fichiers du conteneur est en lecture seule, /tmp est un petit tmpfs) : la
  # réponse est transmise au rythme du client, comme la vidéo de la fiche Creative (11,9 Mo).
  proxy_max_temp_file_size 0;

  if ($request_method ~ ^(TRACE|TRACK|CONNECT)$) { return 405; }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Réservé au réseau interne (jeton d'administration) : jamais exposé par le frontal.
  location ~ ^/api/(admin|revalidate)(/|$) {
    return 403;
  }

  location ~ ^/api/auth(/|$) {
    limit_req zone=auth burst=20 nodelay;
    include /etc/nginx/conf.d/proxy-site.inc;
    proxy_pass http://site;
  }

  location = /api/contact {
    limit_req zone=contact burst=5 nodelay;
    include /etc/nginx/conf.d/proxy-site.inc;
    proxy_pass http://site;
  }

  location = /api/stripe/webhook {
    limit_req zone=webhook burst=40 nodelay;
    include /etc/nginx/conf.d/proxy-site.inc;
    proxy_pass http://site;
  }

  # Flux d'une passerelle compatible OpenAI : pas de tampon, délai long.
  location ~ ^/v1(/|$) {
    limit_req zone=gateway burst=60 nodelay;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    include /etc/nginx/conf.d/proxy-site.inc;
    proxy_pass http://site;
  }

  location / {
    include /etc/nginx/conf.d/proxy-site.inc;
    proxy_pass http://site;
  }
}
