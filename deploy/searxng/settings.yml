# SearXNG au service de Nexora WebPilot (POST /v1/webpilot/search). Service interne : aucune interface publique, aucun
# cookie, aucun compte. Seul le site et le worker l'appellent, sur le réseau interne « nexora-webpilot-search ».
# Aucun secret ici : le champ secret_key ne signe rien d'utile (pas de session, pas de limiteur) ; SearXNG refuse
# seulement sa valeur par défaut « ultrasecretkey ». Pour le remplacer, passer la variable SEARXNG_SECRET au conteneur.
use_default_settings: true

general:
  instance_name: "Nexora WebPilot"
  enable_metrics: false

search:
  # Filtre « modéré » ; les formats html et json sont ceux dont WebPilot et un essai à la main ont besoin.
  safe_search: 1
  autocomplete: ""
  formats:
    - html
    - json

server:
  secret_key: "interne-webpilot-aucun-cookie-aucune-session"
  limiter: false
  public_instance: false
  image_proxy: false
  http_protocol_version: "1.0"

outgoing:
  request_timeout: 6.0
  useragent_suffix: "NexoraWebPilot"
