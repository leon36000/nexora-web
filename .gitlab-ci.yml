# Preuve isolée : ne démarre que lors d'un lancement manuel sur cette branche.
workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "proof/sonar-token-environment-scope-20261116" && $CI_PIPELINE_SOURCE == "web"'
    - when: never

stages:
  - preuve

default:
  image: node@sha256:aca79828f8a4afc627f189387c965625bcc419233946210a3b9522d90a59b5c6
  tags:
    - nexora-fast-docker

sonarqube-environment-token-present:
  stage: preuve
  environment:
    name: sonarqube
    action: prepare
  script:
    - |
      set -eu
      test "${CI_COMMIT_REF_PROTECTED:-}" = true
      test "${CI_ENVIRONMENT_NAME:-}" = sonarqube
      test -n "${SONAR_TOKEN:-}"
      printf '%s\n' 'SONAR_TOKEN_PRESENT=yes'

no-environment-token-absent:
  stage: preuve
  script:
    - |
      set -eu
      test "${CI_COMMIT_REF_PROTECTED:-}" = true
      test -z "${CI_ENVIRONMENT_NAME:-}"
      if [ "${SONAR_TOKEN+x}" = x ]; then
        printf '%s\n' 'SONAR_TOKEN_ABSENT=no'
        exit 1
      else
        printf '%s\n' 'SONAR_TOKEN_ABSENT=yes'
      fi
